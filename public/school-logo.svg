<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Trim -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Laurel Wreath Around Crest -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="3" stroke-linecap="round">
    <!-- Left Branch -->
    <path d="M 110 330 C 80 250, 90 170, 150 110" />
    <path d="M 125 310 Q 100 295, 95 270 Q 115 280, 125 310 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 108 265 Q 85 245, 85 220 Q 105 235, 108 265 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 102 215 Q 85 190, 92 165 Q 110 185, 102 215 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 110 165 Q 98 140, 115 120 Q 128 145, 110 165 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 130 125 Q 125 100, 150 90 Q 155 115, 130 125 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Right Branch -->
    <path d="M 390 330 C 420 250, 410 170, 350 110" />
    <path d="M 375 310 Q 400 295, 405 270 Q 385 280, 375 310 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 392 265 Q 415 245, 415 220 Q 395 235, 392 265 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 398 215 Q 415 190, 408 165 Q 390 185, 398 215 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 390 165 Q 402 140, 385 120 Q 372 145, 390 165 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 370 125 Q 375 100, 350 90 Q 345 115, 370 125 Z" fill="url(#goldGrad)" opacity="0.85" />
  </g>

  <!-- Central Shield -->
  <path d="M 160 140 L 340 140 Q 350 250, 250 380 Q 150 250, 160 140 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linejoin="round" />

  <!-- Inner Shield Inset Border -->
  <path d="M 175 155 L 325 155 Q 335 245, 250 355 Q 165 245, 175 155 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        opacity="0.7" />

  <!-- Shield Top Heraldic Division -->
  <path d="M 175 220 L 325 220" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Three Golden Stars (Top Half) -->
  <g fill="url(#goldGrad)">
    <!-- Center star -->
    <path d="M 250 165 L 253 175 L 263 175 L 255 181 L 258 191 L 250 185 L 242 191 L 245 181 L 237 175 L 247 175 Z" />
    <!-- Left star -->
    <path d="M 210 175 L 212 183 L 220 183 L 214 188 L 216 196 L 210 191 L 204 196 L 206 188 L 200 183 L 208 183 Z" transform="scale(0.9) translate(15, 10)" />
    <!-- Right star -->
    <path d="M 290 175 L 292 183 L 300 183 L 294 188 L 296 196 L 290 191 L 284 196 L 286 188 L 280 183 L 288 183 Z" transform="scale(0.9) translate(25, 10)" />
  </g>

  <!-- Open Book of Wisdom -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M 250 310 C 235 302, 205 300, 190 312 L 190 262 C 205 250, 235 252, 250 264 Z" fill="#1e293b" fill-opacity="0.9" />
    <!-- Right page -->
    <path d="M 250 310 C 265 302, 295 300, 310 312 L 310 262 C 295 250, 265 252, 250 264 Z" fill="#1e293b" fill-opacity="0.9" />
    <!-- Center spine -->
    <line x1="250" y1="264" x2="250" y2="310" stroke-width="3.5" />
    <!-- Page lines -->
    <line x1="202" y1="274" x2="238" y2="268" stroke-width="1.5" opacity="0.7" />
    <line x1="202" y1="284" x2="238" y2="278" stroke-width="1.5" opacity="0.7" />
    <line x1="202" y1="294" x2="238" y2="288" stroke-width="1.5" opacity="0.7" />
    
    <line x1="262" y1="268" x2="298" y2="274" stroke-width="1.5" opacity="0.7" />
    <line x1="262" y1="278" x2="298" y2="284" stroke-width="1.5" opacity="0.7" />
    <line x1="262" y1="288" x2="298" y2="294" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Torch of Knowledge Rising from Book -->
  <g>
    <!-- Torch Handle -->
    <path d="M 245 264 L 255 264 L 253 235 L 247 235 Z" fill="url(#goldGrad)" />
    <path d="M 243 235 L 257 235 L 259 228 L 241 228 Z" fill="url(#goldGrad)" />
    <!-- Vibrant Torch Flame -->
    <path d="M 250 198 C 243 210, 238 218, 244 228 C 248 228, 252 228, 256 228 C 262 218, 257 210, 250 198 Z" fill="url(#flameGrad)" filter="url(#glow)" />
    <path d="M 250 205 C 246 213, 244 218, 247 225 C 249 225, 251 225, 253 225 C 256 218, 254 213, 250 205 Z" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Banner Ribbon at Bottom -->
  <path d="M 120 400 L 160 375 L 340 375 L 380 400 L 360 425 L 330 415 L 250 425 L 170 415 L 140 425 Z" 
        fill="#0f172a" 
        stroke="url(#goldGrad)" 
        stroke-width="3" />
  
  <text x="250" y="405" 
        font-family="'Cinzel', 'Times New Roman', serif" 
        font-size="16" 
        font-weight="bold" 
        fill="url(#goldGrad)" 
        letter-spacing="5" 
        text-anchor="middle">
    EST. 1988
  </text>
</svg>
